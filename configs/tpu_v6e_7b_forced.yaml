# 일반 RLVR + 그룹 중 일부 롤아웃만 그림 강제 시작. tpu_v6e_7b.yaml 과 차이: instruction, continuation, forced_image
model:
  kind: tar7b
  hf_id: csuhan/Tar-7B-v0.1   # ByteDance-Seed/Tar-7B 와 파일 해시 전부 동일 (2026-11-25 확인)
  local_path: /mnt/work/tar7b_lm
  tokenizer_path: /mnt/work/tar7b_lm
  num_visual_tokens: 65536
  remat: false          # qwix LoRA 와 nnx.remat 충돌 → 끔
  lora:
    enabled: true
    rank: 32
    alpha: 64
    seed: 0
data:
  source: cova
  hf_id: tsunghanwu/cova
  split: train
  tasks: [math_vr, mathnet]
  max_answer_chars: 60
  instruction: neutral   # 그림 유도 문장("You may sketch …") 없는 일반 RLVR 지시문
  n_samples: null
  passrate_file: data/passrate_1200.json
  solution_len_file: data/solution_len.json
  max_solution_tokens: 768
mesh: [[4, 1], [fsdp, tp]]
grpo:
  num_generations: 8
  temperature: 0.8
  max_prompt_length: 384
  max_completion_length: 768
  continuation: {enabled: false}   # 그림 뒤 EOS 에 텍스트를 붙이지 않는다
  forced_image: {enabled: true, per_group: 2, prefix: "<im_start><S2>"}   # 그룹 8개 중 2개만 그림 강제 시작 (loss 제외)
  beta: 0.0
  epsilon: 0.2
  learning_rate: 1.0e-5
  batch_size: 2
  train_micro_batch_size: 1
  logps_micro_batch_size: 1
  rollout_micro_batch_size: 1
  max_steps: 300
  eval_every: 10
rewards:
  correctness: 1.0
  format: 0.0
  visual_budget: 0.0   # 시각 사용에 직접 보상 없음 — 정답률을 올릴 때만 살아남는지 본다
  max_visual_tokens_per_image: 128
telemetry:              # logs/runs/<run>/ 에 기록 → scripts/wandb_sync.py 로 업로드
  enabled: true
  log_kl: false        # true 면 7B 학습 step 이 OOM (reference 가 HBM 을 더 씀). beta=0 이라 loss 엔 영향 없음
  token_metrics: false   # 학습 forward 의 logits 로 entropy(텍스트/시각)·P(<im_start>)
  sample_every: 50
  n_samples: 10
eval:                   # held-out: 아래 개수만큼 학습 데이터에서 고정 시드로 빼서 eval 전용으로 쓴다
  n_prompts: 100
  every: 25
  at_start: true        # step 0 (학습 전) 기준선
  pass_k: 8             # n_prompts × 8 샘플 — eval 비용 대부분이 여기. k_prompts 로 줄일 수 있음
  k_prompts: 32
  batch: 16
  seed: 4242
checkpoint_dir: /mnt/work/ckpt   # <dir>/<run 이름>. 같은 이름으로 재실행하면 이어서 학습
checkpoint_every_secs: 900
