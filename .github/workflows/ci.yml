name: ci
on: [push, pull_request]
jobs:
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[cpu,dev]"
      - run: pytest -q                       # reward verifiers
      - run: python scripts/train.py --config configs/smoke_cpu.yaml --max-steps 2   # tiny model, 2 GRPO steps
