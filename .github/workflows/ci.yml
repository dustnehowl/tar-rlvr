name: ci
on: [push, pull_request]
jobs:
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra cpu --extra dev
      - run: uv run pytest -q
      - run: uv run python scripts/train.py --config configs/smoke_cpu.yaml --max-steps 2
